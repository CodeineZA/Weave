services:
  # --- Weave Voice Chat Application ---
  # Voice chat signaling server built with Node.js + WebRTC
  # Runs on Docker bridge network and exposes port 3000 for Cloudflare tunnel
  weave-voice:
    build:
      context: /home/codeine/server/docker/weave-voice
      dockerfile: Dockerfile
    container_name: weave-voice
    restart: unless-stopped
    ports:
      - "3000:3000"  # Exposed on all interfaces for tunnel access
    environment:
      - SERVER_PASSWORD=friends123  # Change to strong password
      - PORT=3000
      - TURN_URL=turn:weave-coturn:3478
      - TURN_USERNAME=webrtc
      - TURN_CREDENTIAL=${TURN_SECRET:-shared-secret-change-me}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - weave-coturn

  # --- TURN/STUN Server for NAT Traversal ---
  # Handles media relay when direct P2P fails (behind firewalls/NAT)
  # Accessed internally by weave-voice via Docker DNS: weave-coturn:3478
  weave-coturn:
    image: coturn/coturn:latest
    container_name: weave-coturn
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"        # TURN/STUN (TCP)
      - "3478:3478/udp"        # TURN/STUN (UDP)
      - "5349:5349/tcp"        # TURNS (TLS/TCP)
      - "5349:5349/udp"        # TURNS (TLS/UDP)
    volumes:
      - /home/codeine/server/docker/weave-voice/coturn.conf:/etc/coturn/turnserver.conf:ro
    environment:
      - TURN_SECRET=${TURN_SECRET:-shared-secret-change-me}
    healthcheck:
      test: ["CMD", "coturn-client-cli", "-u", "webrtc", "-w", "${TURN_SECRET:-shared-secret-change-me}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- Dedicated Cloudflare Tunnel for weave-voice ---
  # Securely exposes weave.codeine.cloud to the internet
  # Routes traffic to weave-voice:3000 via Cloudflare Zero Trust
  weave-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: weave-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --loglevel debug run
    environment:
      - TUNNEL_TOKEN=eyJhIjoiNGZkYmUwY2ZmYzI1OGZmZDFiOGE2YTFmZDc2NmE4ZGUiLCJ0IjoiNzA3NmQzMGQtOWZjNy00ZmQwLWJiNTMtMmU2NWIzMGZjOGY2IiwicyI6IlpXSmhOMkU1TVdFdFl6TmhaaTAwTlRVM0xUa3haV1V0TkdNeE1EUTRZbUU1T1RSaSJ9
    depends_on:
      - weave-voice
    networks:
      - default
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 127.0.0.11
      - 8.8.8.8

networks:
  default:
    name: weave_default
    driver: bridge
