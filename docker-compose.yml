services:
  weave-voice:
    build:
      context: .
      dockerfile: docker/weave-voice/Dockerfile
    container_name: weave-voice
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-3000}:3000"
      - "${RTC_MIN_PORT:-10000}-${RTC_MAX_PORT:-10100}:${RTC_MIN_PORT:-10000}-${RTC_MAX_PORT:-10100}/udp"
    environment:
      - PORT=3000
      - ANNOUNCED_IP=${ANNOUNCED_IP}
      - LOCAL_ANNOUNCED_IP=${LOCAL_ANNOUNCED_IP:-}
      - RTC_MIN_PORT=${RTC_MIN_PORT:-10000}
      - RTC_MAX_PORT=${RTC_MAX_PORT:-10100}
    volumes:
      - ./logs:/app/logs
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  default:
    name: weave_default
    driver: bridge

volumes:
  app_data:
    name: weave_data
    driver: local
