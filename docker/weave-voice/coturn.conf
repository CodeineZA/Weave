# Coturn TURN/STUN Server Configuration
# Used by weave-voice for WebRTC NAT traversal

# Listening port (UDP/TCP)
listening-port=3478

# TLS port (disabled - no certs configured)
# tls-listening-port=5349

# Listen on all interfaces
listening-ip=0.0.0.0

# Public IP of the Raspberry Pi (for NAT traversal)
external-ip=89.6.149.175

# Relay traffic on all interfaces
relay-ip=0.0.0.0

# Limit relay port range (these ports must be forwarded on your router)
min-port=49152
max-port=49200

# Realm (must match what clients expect)
realm=codeine.cloud

# Static username/password auth (matches TURN_USERNAME/TURN_CREDENTIAL in docker-compose)
lt-cred-mech
user=webrtc:shared-secret-change-me

# Disable TLS/DTLS (no certs configured)
no-tls
no-dtls

# Log to stdout (visible via docker logs)
log-file=stdout
no-stdout-log=false

# Security: don't allow loopback relay
no-loopback-peers

# Security: don't allow multicast relay
no-multicast-peers
